<div class="container">

  <h1 class="title">Manage Applications</h1>

  @if (applications().length === 0) {
    <p class="empty">No applications yet</p>
  }

  <div class="grid">

    @for (app of filteredApplications(); track app.id) {

      <div class="app-card">

        <!-- HEADER -->
        <div class="app-header">
          <span class="trip-name">
            {{ getTripTitle(app.tripId) }}
          </span>

          <span class="status {{ app.status }}">
            {{ app.status }}
          </span>
        </div>

        <!-- BODY -->
        <div class="app-body">
          <p><strong>Explorer:</strong> {{ app.explorerId }}</p>
          <p class="date">{{ app.moment | date:'short' }}</p>
        </div>

        <!-- ACTIONS -->
        <div class="actions">

          @if (app.status === 'PENDING') {

            <button class="reject" (click)="reject(app)">
              Reject
            </button>

            <button class="due" (click)="markDue(app)">
              Mark DUE
            </button>

          }

        </div>

      </div>

    }

  </div>

</div>
