<!-- src/app/features/trips/manager-applications/manager-applications.component.html -->
<h1>Applications</h1>

<!-- Mostrar el loading mientras se cargan las applications -->
<div *ngIf="loading" class="loader">
  Loading applications...
</div>

<!-- Mostrar solo si hay aplicaciones -->
<table *ngIf="!loading && applications().length > 0">
  <thead>
    <tr>
      <th>Explorer</th>
      <th>Status</th>
      <th>Comments</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let application of applications()">
      <td>{{ application.explorerId }}</td>
      <td>{{ application.status }}</td>
      <td>{{ application.comments }}</td>
      <td>
        <button (click)="acceptApplication(application)">Accept</button>
        <button (click)="rejectApplication(application)">Reject</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Mostrar mensaje si no hay applications -->
<div *ngIf="!loading && applications().length === 0">
  No applications available at the moment.
</div>
