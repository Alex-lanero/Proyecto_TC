<header class="header">

  <div class="logo">🌍 Acme Explorer</div>

  <nav class="nav">

    <div class="lang-buttons">
      <button 
        (click)="changeLang('es')"
        [class.active]="TranslatePipe.currentLang === 'es'"
      >
        ES
      </button>

      <button 
        (click)="changeLang('en')"
        [class.active]="TranslatePipe.currentLang === 'en'"
      >
        EN
      </button>
    </div>
    <a routerLink="/home">Home</a>
    <a routerLink="/trips">Trips</a>
    <a routerLink="/explorer-applications">My Applications</a>

    @if (!authService.isLogged()) {
      <a routerLink="/login">Login</a>
    } @else {
      <button (click)="logout()">Logout</button>
    }

  </nav>

</header>
